kotlin.code.style=official

# The shared `nativeMain` source set consumes the per-target `netif` cinterop.
# Without commonization `compileNativeMainKotlinMetadata` cannot resolve the
# generated declarations and publication fails.
kotlin.mpp.enableCInteropCommonization=true

# The source-set hierarchy (nativeMain / jvmSharedMain) is wired explicitly
# below, so the automatic template would only produce warnings.
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Apple/Windows targets are declared on every host but can only be built on the
# matching host. Hide the "target is not supported on this host" warnings.
kotlin.native.ignoreDisabledTargets=true

org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
