# Tag-triggered release.
#
#   test    (ubuntu-latest) — fast gate: jvmTest + linuxX64Test and a
#           cross-compilation smoke test for Android / Android-Native / mingw.
#
#   publish (macos-latest (Apple Silicon)) — the only host that can build the Apple targets. It
#           cross-builds every other target as well, so the whole library is
#           published from a single Sonatype Central deployment.
#
# Conventions mirror the rest of the caffeine-mgn/* repos: the GPG key is
# imported into the system keyring once at job start, `signingUseGpg` flips the
# build to `useGpgCmd()`, and the Central token plus GPG key id/passphrase are
# forwarded as `-PmavenCentral*` / `-Psigning.gnupg.*` Gradle properties.

name: Release to Maven Central

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

env:
  KONAN_VERSION: "2.4.21"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang mingw-w64

      - name: Pre-fetch Kotlin/Native
        run: |
          set -euo pipefail
          KONAN_DIR="$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-${KONAN_VERSION}"
          if [ ! -f "${KONAN_DIR}/konan/konan.properties" ]; then
            mkdir -p "${KONAN_DIR}"
            curl -fsSL \
              "https://github.com/JetBrains/kotlin/releases/download/v${KONAN_VERSION}/kotlin-native-prebuilt-linux-x86_64-${KONAN_VERSION}.tar.gz" \
              | tar -xz --strip-components=1 -C "${KONAN_DIR}"
          fi
          ls "${KONAN_DIR}/konan/konan.properties"

      - name: Pre-fetch cross toolchains
        run: ./gradlew downloadKonanToolchainLinux_arm64 downloadKonanToolchainMingw_x64 --stacktrace

      - name: Run JVM and Linux native tests
        run: ./gradlew jvmTest linuxX64Test --stacktrace

      - name: Cross-compile Android, Android/Native and Windows targets
        run: >-
          ./gradlew
          compileDebugKotlinAndroid
          compileKotlinAndroidNativeArm64
          compileKotlinAndroidNativeX86
          compileKotlinMingwX64
          linkDebugTestAndroidNativeArm64
          linkDebugTestAndroidNativeArm32
          linkDebugTestAndroidNativeX86
          buildDynamicNetif_jniMingwX64
          assembleRelease
          --stacktrace

      - name: Verify Android AAR carries every JNI ABI
        run: |
          set -euo pipefail
          AAR="$(find build/outputs/aar -name '*-release.aar' | head -1)"
          echo "aar: $AAR"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libnetif_jni.so" || {
              echo "ERROR: AAR is missing jni/$abi/libnetif_jni.so"
              exit 1
            }
          done

  publish:
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$SDKMGR" ] || SDKMGR="$(command -v sdkmanager)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Pre-fetch Kotlin/Native (macOS arm64)
        run: |
          set -euo pipefail
          KONAN_DIR="$HOME/.konan/kotlin-native-prebuilt-macos-aarch64-${KONAN_VERSION}"
          if [ ! -f "${KONAN_DIR}/konan/konan.properties" ]; then
            mkdir -p "${KONAN_DIR}"
            curl -fsSL \
              "https://github.com/JetBrains/kotlin/releases/download/v${KONAN_VERSION}/kotlin-native-prebuilt-macos-aarch64-${KONAN_VERSION}.tar.gz" \
              | tar -xz --strip-components=1 -C "${KONAN_DIR}"
          fi
          ls "${KONAN_DIR}/konan/konan.properties"

      - name: Pre-fetch cross toolchains
        run: >-
          ./gradlew
          downloadKonanToolchainLinux_x64
          downloadKonanToolchainLinux_arm64
          downloadKonanToolchainMingw_x64
          --stacktrace

      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSWORD }}
        run: |
          set -euo pipefail
          command -v gpg >/dev/null 2>&1 || brew install gnupg
          # A fresh macOS runner has no ~/.gnupg yet, and gpg-agent.conf must be
          # written before the first import.
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent
          if [ -n "$GPG_PASSPHRASE" ]; then
            printf '%b' "$GPG_KEY" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import
          else
            printf '%b' "$GPG_KEY" | gpg --batch --pinentry-mode loopback --import
          fi

      - name: Run JVM and native tests
        run: ./gradlew jvmTest macosArm64Test iosSimulatorArm64Test tvosSimulatorArm64Test watchosSimulatorArm64Test --stacktrace

      - name: Repository hygiene (no build outputs tracked)
        run: test "$(git ls-files | grep -cE '^(build|\.gradle)/')" = "0"

      - name: Publish to Maven Central
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          PUBLISH_VERSION: ${{ github.ref_name }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          ./gradlew publishToMavenCentral \
            -Pversion="$PUBLISH_VERSION" \
            -PsigningUseGpg=true \
            -Psigning.gnupg.keyName="$GPG_KEY_ID" \
            -Psigning.gnupg.passphrase="$GPG_PASSWORD" \
            -PmavenCentralUsername="$CENTRAL_USERNAME" \
            -PmavenCentralPassword="$CENTRAL_PASSWORD"
